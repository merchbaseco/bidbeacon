x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bidbeacon-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${BIDBEACON_DATABASE_NAME:-bidbeacon}
      POSTGRES_USER: ${BIDBEACON_DATABASE_USER:-bidbeacon}
      POSTGRES_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidbeacon -d bidbeacon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - VITE_CLERK_PUBLISHABLE=${VITE_CLERK_PUBLISHABLE_KEY}
      secrets:
        - hugeicons_license_key
        - merchbase_npm_token
    image: bidbeacon-server:local
    container_name: bidbeacon-server
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 8080
      BIDBEACON_DATABASE_HOST: ${BIDBEACON_DATABASE_HOST:-postgres}
      BIDBEACON_DATABASE_PORT: ${BIDBEACON_DATABASE_PORT:-5432}
      BIDBEACON_DATABASE_NAME: ${BIDBEACON_DATABASE_NAME:-bidbeacon}
      BIDBEACON_DATABASE_USER: ${BIDBEACON_DATABASE_USER:-bidbeacon}
      BIDBEACON_DATABASE_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
      ADS_API_REFRESH_TOKEN: ${ADS_API_REFRESH_TOKEN}
      ADS_API_CLIENT_ID: ${ADS_API_CLIENT_ID}
      ADS_API_CLIENT_SECRET: ${ADS_API_CLIENT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AMS_QUEUE_URL: ${AMS_QUEUE_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET}
      DISABLE_SERVER_JOB_RUNNER: ${DISABLE_SERVER_JOB_RUNNER:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(res=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: bidbeacon-server:local
    container_name: bidbeacon-worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      BIDBEACON_DATABASE_HOST: ${BIDBEACON_DATABASE_HOST:-postgres}
      BIDBEACON_DATABASE_PORT: ${BIDBEACON_DATABASE_PORT:-5432}
      BIDBEACON_DATABASE_NAME: ${BIDBEACON_DATABASE_NAME:-bidbeacon}
      BIDBEACON_DATABASE_USER: ${BIDBEACON_DATABASE_USER:-bidbeacon}
      BIDBEACON_DATABASE_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
      ADS_API_REFRESH_TOKEN: ${ADS_API_REFRESH_TOKEN}
      ADS_API_CLIENT_ID: ${ADS_API_CLIENT_ID}
      ADS_API_CLIENT_SECRET: ${ADS_API_CLIENT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AMS_QUEUE_URL: ${AMS_QUEUE_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - bidbeacon
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/worker.js' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
      args:
        - VITE_CLERK_PUBLISHABLE=${VITE_CLERK_PUBLISHABLE_KEY}
      secrets:
        - hugeicons_license_key
        - merchbase_npm_token
    image: bidbeacon-caddy:local
    container_name: bidbeacon-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  hugeicons_license_key:
    environment: HUGEICONS_LICENSE_KEY
  merchbase_npm_token:
    environment: MERCHBASE_NPM_TOKEN

networks:
  bidbeacon:
    driver: bridge
