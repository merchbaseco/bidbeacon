services:
  postgres:
    image: postgres:16-alpine
    container_name: bidbeacon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bidbeacon
      POSTGRES_USER: bidbeacon
      POSTGRES_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidbeacon -d bidbeacon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - MERCHBASE_NPM_TOKEN=${MERCHBASE_NPM_TOKEN}
    image: bidbeacon-server:local
    container_name: bidbeacon-server
    restart: unless-stopped
    environment:
      PORT: 8080
      BIDBEACON_DATABASE_HOST: postgres
      BIDBEACON_DATABASE_PORT: 5432
      BIDBEACON_DATABASE_NAME: bidbeacon
      BIDBEACON_DATABASE_USER: bidbeacon
      BIDBEACON_DATABASE_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
      ADS_API_REFRESH_TOKEN: ${ADS_API_REFRESH_TOKEN}
      ADS_API_CLIENT_ID: ${ADS_API_CLIENT_ID}
      ADS_API_CLIENT_SECRET: ${ADS_API_CLIENT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AMS_QUEUE_URL: ${AMS_QUEUE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(res=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: bidbeacon-server:local
    container_name: bidbeacon-worker
    restart: unless-stopped
    environment:
      BIDBEACON_DATABASE_HOST: postgres
      BIDBEACON_DATABASE_PORT: 5432
      BIDBEACON_DATABASE_NAME: bidbeacon
      BIDBEACON_DATABASE_USER: bidbeacon
      BIDBEACON_DATABASE_PASSWORD: ${BIDBEACON_DATABASE_PASSWORD}
      ADS_API_REFRESH_TOKEN: ${ADS_API_REFRESH_TOKEN}
      ADS_API_CLIENT_ID: ${ADS_API_CLIENT_ID}
      ADS_API_CLIENT_SECRET: ${ADS_API_CLIENT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AMS_QUEUE_URL: ${AMS_QUEUE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - bidbeacon
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/worker.js' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
      args:
        - MERCHBASE_NPM_TOKEN=${MERCHBASE_NPM_TOKEN}
    image: bidbeacon-caddy:local
    container_name: bidbeacon-caddy
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bidbeacon
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  bidbeacon:
    driver: bridge
