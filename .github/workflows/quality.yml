name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      # The private @merchbaseco/* scope needs a real GitHub Packages read
      # token: Actions' own `github.token` cannot download another repository's
      # package unless that package grants this repository access, so it is not
      # a substitute. The token is an @internal schema item, resolved here from
      # the Development vault through the deploy identity. The plugin version is
      # pinned in .env.schema, so this works before node_modules exists.
      - name: Install dependencies
        timeout-minutes: 5
        env:
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          MERCHBASE_GITHUB_NPM_TOKEN="$(
            BIDBEACON_RESOLVE_INSTALL_TOKENS=true \
            bunx varlock@1.16.1 printenv MERCHBASE_GITHUB_NPM_TOKEN
          )"
          if [ -z "${MERCHBASE_GITHUB_NPM_TOKEN}" ]; then
            echo "MERCHBASE_GITHUB_NPM_TOKEN did not resolve; the private @merchbaseco/* packages cannot be installed." >&2
            exit 1
          fi
          export MERCHBASE_GITHUB_NPM_TOKEN
          bun install --frozen-lockfile

      # `check:fast` pins the schema's `test` lifecycle itself, so the gates run
      # fully offline with no 1Password access of their own.
      #
      # Policy, not an oversight: Quality runs the fast lane only. It
      # deliberately does not run `bun run build` — the Deploy workflow builds
      # the images for real and is the build's proof — and does not run the
      # PGlite database-simulation suites, which boot a WebAssembly Postgres per
      # test and live in the `test:integration` lane. Nothing is skipped where
      # it matters: `bun run check` runs `check:fast`, `test:integration`, and
      # `build`, and that is what gates local work and the deploy path. Keep
      # this job free of builds and database simulations.
      - name: Run fast quality gates
        run: bun run check:fast
