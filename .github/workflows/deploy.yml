name: Deploy Stack

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: SHA on main to deploy. Set this to roll back.
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: bidbeacon-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve SHA
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      explicit_ref: ${{ steps.target.outputs.explicit_ref }}
    steps:
      - id: target
        env:
          REF: ${{ github.event.inputs.ref }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${REF:-$SHA}"
          explicit_ref=false
          if [ -n "$REF" ]; then
            explicit_ref=true
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Target must be a 40-character lowercase SHA." >&2
            exit 1
          fi
          printf 'sha=%s\nexplicit_ref=%s\n' "$sha" "$explicit_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Stack
    needs: resolve
    uses: merchbaseco/workflows/.github/workflows/deploy-service.yml@main
    secrets: inherit
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      explicit_ref: ${{ needs.resolve.outputs.explicit_ref == 'true' }}
      production_checkout: /Users/zknicker/srv/bidbeacon
      runner: self-hosted
      deploy_command: CI_OP_TOKEN="$DEPLOY_AGENT_PRODUCTION_OP_TOKEN" env -u MERCHBASE_GITHUB_NPM_TOKEN bun run deploy
      install_command: if [ "$RUNNER_OS" = macOS ]; then echo "Skipping host install. The image build resolves GitHub Packages and HugeIcons credentials."; exit 0; fi; bun install --frozen-lockfile
      publish_install_command: . ./scripts/install-tokens && bun install --frozen-lockfile
      health_urls: https://bidbeacon.merchbase.co/api/live
      published_packages: packages/bidbeacon-api-client:@bidbeacon/http-client,packages/bidbeacon-cli:@bidbeacon/cli
      publish_provenance: true
      bun_version: "1.4.2"
      prepublish_command: bun run api-client:build && bun run cli:build
      release_token_env_name: RELEASE_AGENT_TOOLING_OP_TOKEN
      release_switch_env_name: BIDBEACON_RESOLVE_RELEASE_TOKENS
