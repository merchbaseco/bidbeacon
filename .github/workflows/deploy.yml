name: Deploy Stack

# Manual only. Pushing to main no longer deploys: a deploy is an explicit act
# now that it resolves production credentials from 1Password.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stack
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Stack
    # The stack is hosted on the Mac mini, so GitHub Actions stays the single
    # deploy surface and the job runs on the mini's self-hosted runner.
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Sync the deployment checkout
        id: sync
        working-directory: /Users/zknicker/srv/bidbeacon
        run: |
          # Move the long-lived deploy checkout to the exact dispatched commit.
          # This discards tracked-file edits on the host that would otherwise
          # make a fast-forward pull fail.
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git reset --hard FETCH_HEAD
          git rev-parse HEAD

      - name: Deploy
        id: deploy
        working-directory: /Users/zknicker/srv/bidbeacon
        env:
          # The deploy-agent role slot, filled here by the GitHub deploy
          # agent's read-only Production identity. The deploy script pins
          # VARLOCK_ENV=production and resolves every value through the schema;
          # no .env file is read and none is written.
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
          # The same identity also fills the development slot: it reads both
          # lifecycle vaults, so the deploy script's install-switch
          # `varlock printenv` calls resolve the GitHub Packages read token and
          # the licensed @hugeicons-pro key from the Development vault. Actions'
          # own `github.token` is deliberately not used for package installs —
          # it cannot download another repository's GitHub Package.
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: bun run deploy -- --expected-revision "${GITHUB_SHA}"

      - name: Install the host CLI wrapper
        id: install_wrapper
        run: |
          BB_BIN_DIR="$(dirname "$(command -v bun)")"
          cat > "${BB_BIN_DIR}/bb" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail

          if ! command -v bun >/dev/null 2>&1; then
            echo "Error: bun is required for BidBeacon CLI but is not installed." >&2
            exit 1
          fi

          # BB_BASE_URL is the published CLI's own contract; the previous
          # wrapper exported BIDBEACON_API_BASE_URL, which the CLI never read.
          export BB_BASE_URL="${BB_BASE_URL:-http://localhost:8091}"
          exec bun /Users/zknicker/srv/bidbeacon/packages/bidbeacon-cli/src/index.ts "$@"
          WRAPPER
          chmod +x "${BB_BIN_DIR}/bb"

      - name: Verify from the consumer
        id: verify
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://bidbeacon.merchbase.co/api/live > /tmp/bidbeacon-live.json
          bun -e '
            const expected = process.env.GITHUB_SHA;
            const body = JSON.parse(await Bun.file("/tmp/bidbeacon-live.json").text());
            if (body.revision !== expected) {
              console.error(`revision mismatch: got ${body.revision}, expected ${expected}`);
              process.exit(1);
            }
          '
          echo "Liveness endpoint OK."

      - name: Notify Haus of a failed deploy
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HAUS_DEPLOY_TRIGGER_URL: ${{ secrets.HAUS_DEPLOY_TRIGGER_URL }}
          HAUS_DEPLOY_TRIGGER_TOKEN: ${{ secrets.HAUS_DEPLOY_TRIGGER_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          CONCLUSION: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_wrapper.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ -z "${HAUS_DEPLOY_TRIGGER_URL}" ] || [ -z "${HAUS_DEPLOY_TRIGGER_TOKEN}" ]; then
            echo "::notice::Haus deploy webhook is not configured. Skipping notification."
            exit 0
          fi

          failed_step="unknown"
          for candidate in \
            "Check out repository|${CHECKOUT_OUTCOME}" \
            "Sync the deployment checkout|${SYNC_OUTCOME}" \
            "Deploy|${DEPLOY_OUTCOME}" \
            "Install the host CLI wrapper|${INSTALL_OUTCOME}" \
            "Verify from the consumer|${VERIFY_OUTCOME}"; do
            outcome="${candidate##*|}"
            if [ "${outcome}" = "failure" ] || [ "${outcome}" = "cancelled" ]; then
              failed_step="${candidate%%|*}"
              break
            fi
          done
          export FAILED_STEP="${failed_step}"

          bun -e '
            const payload = {
              repo: process.env.REPO,
              workflow: process.env.WORKFLOW,
              run_url: process.env.RUN_URL,
              sha: process.env.SHA,
              ref: process.env.REF,
              conclusion: process.env.CONCLUSION,
              failed_step: process.env.FAILED_STEP,
            };
            process.stdout.write(JSON.stringify(payload));
          ' | curl --fail --show-error --silent \
            --proto '=https' \
            --request POST \
            --max-time 10 \
            --output /dev/null \
            --user-agent "BidBeacon-Deploy-Notifier/1.0" \
            --header "Authorization: Bearer ${HAUS_DEPLOY_TRIGGER_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "${HAUS_DEPLOY_TRIGGER_URL}"
